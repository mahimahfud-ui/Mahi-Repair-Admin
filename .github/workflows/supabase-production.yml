name: Protected Supabase Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Explicitly approve deploying this main-branch commit to production"
        type: choice
        required: true
        default: "no"
        options:
          - "no"
          - "yes"
      deploy_send_email_hook:
        description: "Also sync the Resend/Brevo secrets and deploy the HMAC-authenticated Send Email Hook (do not enable the Auth Hook until inbox tests pass)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: mahi-repair-supabase-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production intent
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch and explicit confirmation
        env:
          REF: ${{ github.ref }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Production deployment can only be dispatched from main."
            exit 1
          fi
          if [[ "$CONFIRM_PRODUCTION" != "yes" ]]; then
            echo "::error::Set confirm_production=yes to deploy."
            exit 1
          fi

  deploy:
    name: Apply migrations and deploy Edge Functions
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: shwqsljicmhflnvjqjah
      ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
      DEPLOY_SEND_EMAIL_HOOK: ${{ inputs.deploy_send_email_hook }}
    steps:
      - name: Checkout reviewed main commit
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate production credentials and origin
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "::error::Missing SUPABASE_ACCESS_TOKEN in the supabase-production environment."; exit 1; }
          [[ -n "$SUPABASE_DB_PASSWORD" ]] || { echo "::error::Missing SUPABASE_DB_PASSWORD in the supabase-production environment."; exit 1; }
          [[ "$ADMIN_ORIGIN" == "https://mahi-repair-admin.onrender.com" ]] || { echo "::error::ADMIN_ORIGIN must exactly match the production Admin HTTPS origin."; exit 1; }

      - name: Validate optional Auth Hook secrets before any production mutation
        if: inputs.deploy_send_email_hook
        env:
          SEND_EMAIL_HOOK_SECRET: ${{ secrets.SEND_EMAIL_HOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
        run: |
          set -euo pipefail
          [[ -n "$SEND_EMAIL_HOOK_SECRET" ]] || { echo "::error::Missing SEND_EMAIL_HOOK_SECRET."; exit 1; }
          [[ -n "$RESEND_API_KEY" ]] || { echo "::error::Missing RESEND_API_KEY."; exit 1; }
          [[ -n "$BREVO_API_KEY" ]] || { echo "::error::Missing BREVO_API_KEY."; exit 1; }
          [[ -n "$AUTH_EMAIL_FROM" ]] || { echo "::error::Missing AUTH_EMAIL_FROM."; exit 1; }

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify the existing recipe-signing private secret is present
        shell: bash
        run: |
          set -euo pipefail
          secret_names="$(supabase secrets list)"
          if ! grep -q 'RECIPE_SIGNING_PRIVATE_KEY_PEM' <<< "$secret_names"; then
            echo "::error::RECIPE_SIGNING_PRIVATE_KEY_PEM is missing in Supabase Edge Function Secrets. Configure it directly in Supabase before deploying."
            exit 1
          fi

      - name: Merge canonical Admin origin into Edge Function secrets
        run: supabase secrets set --yes "ADMIN_ORIGIN=$ADMIN_ORIGIN"

      - name: Review remote migration history and preview changes
        run: |
          set -euo pipefail
          supabase migration list --remote
          supabase db push --dry-run --remote

      - name: Apply reviewed database migrations
        run: supabase db push --yes --remote

      - name: Deploy all Member and Owner Edge Functions with JWT verification enabled
        shell: bash
        run: |
          set -euo pipefail
          functions=(
            admin-assign-tool
            admin-delete-draft-tool
            admin-disable-tool
            admin-invite-member
            admin-manage-device
            admin-manage-member
            admin-manage-tool-state
            admin-publish-tool
            admin-save-validation
            admin-upsert-tool
            get-admin-analytics
            get-my-repair-tools
            get-signed-repair-tool
            register-device
            submit-repair-run
          )
          for function in "${functions[@]}"; do
            supabase functions deploy "$function" --use-api --yes
          done

      - name: Sync optional Send Email Hook provider secrets
        if: inputs.deploy_send_email_hook
        env:
          SEND_EMAIL_HOOK_SECRET: ${{ secrets.SEND_EMAIL_HOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
        run: |
          set -euo pipefail
          supabase secrets set --yes \
            "SEND_EMAIL_HOOK_SECRET=$SEND_EMAIL_HOOK_SECRET" \
            "RESEND_API_KEY=$RESEND_API_KEY" \
            "BREVO_API_KEY=$BREVO_API_KEY" \
            "AUTH_EMAIL_FROM=$AUTH_EMAIL_FROM"

      - name: Deploy HMAC-verified Send Email Auth Hook
        if: inputs.deploy_send_email_hook
        run: supabase functions deploy send-auth-email --use-api --no-verify-jwt --yes

      - name: Report deployed commit and hook state
        env:
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          echo "Deployed production source commit: $DEPLOYED_SHA"
          echo "Base Member/Owner functions: deployed with JWT verification enabled."
          if [[ "$DEPLOY_SEND_EMAIL_HOOK" == "true" ]]; then
            echo "Send Email Hook function: deployed with Standard Webhooks verification."
            echo "Supabase Authentication > Hooks > Send Email remains a separate manual enablement step after inbox tests."
          else
            echo "Send Email Hook function: not deployed by this run."
          fi
